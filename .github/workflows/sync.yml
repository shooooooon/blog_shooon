name: Sync with Manus

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify push
        run: |
          echo "✅ コードがGitHubにプッシュされました"
          echo "📝 変更内容: ${{ github.event.head_commit.message }}"
          echo "👤 コミット者: ${{ github.event.head_commit.author.name }}"
          echo ""
          echo "💡 Manusでの変更も自動的にこのリポジトリに反映されます"
