<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="技術、学び、日々の気づきを綴るブログ。プログラミングや開発に関する知見を共有しています。">
    <meta name="keywords" content="ブログ,技術ブログ,プログラミング,Web開発">
    <meta name="author" content="Shooon">
    <title>Shooon Blog - 技術と学びのブログ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ヘッダー -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo"><a href="index.html">Shooon Blog</a></h1>
                <nav class="nav">
                    <a href="index.html" class="nav-link active">ホーム</a>
                    <a href="posts.html" class="nav-link">記事一覧</a>
                    <a href="about.html" class="nav-link">自己紹介</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero">
        <div class="container">
            <h2 class="hero-title">技術と学びのブログ</h2>
            <p class="hero-description">プログラミング、Web開発、日々の気づきを共有しています</p>
        </div>
    </section>

    <!-- メインコンテンツ -->
    <main class="main">
        <div class="container">
            <section class="section">
                <h2 class="section-title">最新記事</h2>
                <div id="recent-posts" class="posts-grid">
                    <!-- JavaScriptで記事カードを挿入 -->
                    <div class="loading">記事を読み込み中...</div>
                </div>
                <div class="text-center">
                    <a href="posts.html" class="btn">すべての記事を見る</a>
                </div>
            </section>

    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Shooon Blog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
